name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_graphics:
        description: Run GPU tests on the configured relaycore-graphics Windows runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows
  CMAKE_VERSION: 4.0.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VCPKG_BINARY_CACHE_DIR: ${{ github.workspace }}\.vcpkg-bincache

jobs:
  format-check:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Locate clang-format
        id: llvm
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clangFormat = & $vswhere -latest -products * -find **\Llvm\x64\bin\clang-format.exe | Select-Object -First 1
          if (-not $clangFormat) {
          $clangFormat = (Get-Command clang-format -ErrorAction SilentlyContinue).Source
          }
          if (-not $clangFormat) {
            throw "clang-format.exe not found"
          }
          "clang_format=$clangFormat" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        shell: pwsh
        run: |
          $files = git ls-files -- '*.c' '*.cpp' '*.h' '*.hpp' ':(exclude)extern/**'
          if (-not $files) {
            Write-Host 'No source files found.'
            exit 0
          }
          & "${{ steps.llvm.outputs.clang_format }}" --dry-run --Werror $files

  msvc-debug:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Set up vcpkg
        id: runvcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          cl

      - name: Add clang-format for tooling tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clangFormat = & $vswhere -latest -products * -find **\Llvm\x64\bin\clang-format.exe | Select-Object -First 1
          if (-not $clangFormat) { $clangFormat = (Get-Command clang-format -ErrorAction Stop).Source }
          (Split-Path $clangFormat) >> $env:GITHUB_PATH

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\.vcpkg-bincache
            ~\AppData\Local\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-
      - name: Run debug discipline workflow
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}"
          cmake --workflow --preset debug-discipline-workflow

      - name: Build graphics tests
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}"
          cmake --build --preset graphics-debug
          if ($LASTEXITCODE -ne 0) { throw 'Graphics test build failed' }

  graphics:
    if: github.event_name == 'workflow_dispatch' && inputs.run_graphics
    runs-on: [self-hosted, Windows, X64, relaycore-graphics]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: latest
      - name: Set up vcpkg
        id: runvcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false
      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure and build graphics tests
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}"
          cmake --preset msvc-debug -DRELAYCORE_ENABLE_VULKAN_VALIDATION=ON
          if ($LASTEXITCODE -ne 0) { throw 'Graphics configure failed' }
          cmake --build --preset graphics-debug
          if ($LASTEXITCODE -ne 0) { throw 'Graphics test build failed' }
          cmake --build --preset graphics-debug --target relaycore_vulkan_toolchain_check
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan environment probe build failed' }
      - name: Verify graphics environment
        shell: pwsh
        run: |
          & .\build\msvc-debug\relaycore_vulkan_toolchain_check.exe
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan loader/validation layer probe failed' }
      - name: Run graphics tests
        shell: pwsh
        run: |
          ctest --preset graphics-debug --no-tests=error --output-junit graphics-results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Graphics tests failed' }
          [xml]$results = Get-Content build/msvc-debug/graphics-results.xml -Raw
          $cases = @($results.SelectNodes('//testcase'))
          $skipped = @($results.SelectNodes('//testcase/skipped'))
          $failed = @($results.SelectNodes('//testcase/failure | //testcase/error'))
          if ($cases.Count -eq 0 -or $skipped.Count -ne 0 -or $failed.Count -ne 0) {
            throw "Graphics report: $($cases.Count) tests, $($skipped.Count) skipped, $($failed.Count) failed"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-results
          path: build/msvc-debug/graphics-results.xml

  msvc-relwithdebinfo:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Set up vcpkg
        id: runvcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          cl

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\.vcpkg-bincache
            ~\AppData\Local\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Add clang-format for tooling tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clangFormat = & $vswhere -latest -products * -find **\Llvm\x64\bin\clang-format.exe | Select-Object -First 1
          if (-not $clangFormat) { $clangFormat = (Get-Command clang-format -ErrorAction Stop).Source }
          (Split-Path $clangFormat) >> $env:GITHUB_PATH

      - name: Run RelWithDebInfo discipline workflow
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}"
          cmake --workflow --preset relwithdebinfo-discipline-workflow

  msvc-asan:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Set up vcpkg
        id: runvcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          cl

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\.vcpkg-bincache
            ~\AppData\Local\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Add clang-format for tooling tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clangFormat = & $vswhere -latest -products * -find **\Llvm\x64\bin\clang-format.exe | Select-Object -First 1
          if (-not $clangFormat) { $clangFormat = (Get-Command clang-format -ErrorAction Stop).Source }
          (Split-Path $clangFormat) >> $env:GITHUB_PATH

      - name: Run ASan discipline workflow
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}"
          cmake --workflow --preset asan-discipline-workflow

  clang-tidy:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Set up vcpkg
        id: runvcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: false

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\.vcpkg-bincache
            ~\AppData\Local\vcpkg\downloads
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Install LLVM 22.1.6
        shell: pwsh
        run: |
          $llvmRoot = 'C:\LLVM-22.1.6'
          $installer = "$env:RUNNER_TEMP\LLVM-22.1.6-win64.exe"
          Invoke-WebRequest `
            -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/LLVM-22.1.6-win64.exe' `
            -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$llvmRoot" -Wait -NoNewWindow
          if (-not (Test-Path -LiteralPath "$llvmRoot\bin\clang-tidy.exe" -PathType Leaf)) {
            throw 'LLVM 22.1.6 installation did not provide clang-tidy.exe'
          }
          "$llvmRoot\bin" >> $env:GITHUB_PATH

      - name: Verify clang-tidy configuration
        shell: pwsh
        run: |
          clang-tidy --version
          clang-tidy --verify-config

      - name: Configure compile commands
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}"
          cmake --fresh --preset msvc-debug

      - name: Run targeted clang-tidy
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/run-clang-tidy.ps1 -BuildDirectory build/msvc-debug
