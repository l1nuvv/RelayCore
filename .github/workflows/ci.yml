name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows
  CMAKE_VERSION: 4.2.3
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format-check:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Locate clang-format
        id: llvm
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clangFormat = & $vswhere -latest -products * -find **\clang-format.exe | Select-Object -First 1
          if (-not $clangFormat) {
            $clangFormat = (Get-Command clang-format -ErrorAction SilentlyContinue).Source
          }
          if (-not $clangFormat) {
            throw "clang-format.exe not found"
          }
          "clang_format=$clangFormat" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        shell: pwsh
        run: |
          $files = git ls-files '*.c' '*.cpp' '*.h' '*.hpp'
          if (-not $files) {
            Write-Host 'No source files found.'
            exit 0
          }
          & "${{ steps.llvm.outputs.clang_format }}" --dry-run --Werror $files

  msvc-debug:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          cl

      - name: Configure
        run: cmake --preset msvc-debug

      - name: Build
        run: cmake --build --preset build-msvc-debug

      - name: Test
        run: ctest --preset test-msvc-debug --output-on-failure
